name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair versao e assinar certificado oficial
        env:
          GLAN_RELEASE_SIGN_KEY: ${{ secrets.GLAN_RELEASE_SIGN_KEY }}
        run: |
          VER_CODE=$(grep -Eo 'versionCode[[:space:]]+[0-9]+' app/build.gradle | awk '{print $2}')
          VER_NAME=$(grep -Eo 'versionName[[:space:]]+"[^"]+"' app/build.gradle | sed -E 's/versionName[[:space:]]+"([^"]+)"/\1/')
          echo "VER_CODE=$VER_CODE" >> $GITHUB_ENV
          echo "VER_NAME=$VER_NAME" >> $GITHUB_ENV

          mkdir -p /tmp/ci_sign
          cat > /tmp/ci_sign/ReleaseTool.java <<'JAVA'
          import java.io.*;
          import java.net.InetSocketAddress;
          import java.net.Socket;
          import java.nio.charset.StandardCharsets;
          import java.nio.file.Files;
          import java.nio.file.Paths;
          import java.security.*;
          import java.security.spec.PKCS8EncodedKeySpec;
          import java.util.Base64;
          import java.util.UUID;
          import javax.crypto.Cipher;
          import javax.crypto.SecretKeyFactory;
          import javax.crypto.spec.GCMParameterSpec;
          import javax.crypto.spec.PBEKeySpec;
          import javax.crypto.spec.SecretKeySpec;
          import javax.net.ssl.SSLParameters;
          import javax.net.ssl.SSLSocket;
          import javax.net.ssl.SSLSocketFactory;

          public class ReleaseTool {
              private static final byte HEADER = 0x56;
              private static final String TOPIC = "glan/v30/version/latest";

              private static SecretKeySpec deriveEnvelopeKey() throws Exception {
                  byte[] fullSalt = MessageDigest.getInstance("SHA-256")
                      .digest("gdroidlan-version-envelope-v30".getBytes(StandardCharsets.UTF_8));
                  byte[] salt16 = new byte[16];
                  System.arraycopy(fullSalt, 0, salt16, 0, 16);
                  PBEKeySpec spec = new PBEKeySpec("GLANOFFICIALVERSIONV30".toCharArray(), salt16, 8000, 128);
                  SecretKeyFactory skf = SecretKeyFactory.getInstance("PBKDF2WithHmacSHA256");
                  return new SecretKeySpec(skf.generateSecret(spec).getEncoded(), "AES");
              }

              private static void writeVarLen(ByteArrayOutputStream out, int x) {
                  do {
                      int enc = x % 128;
                      x /= 128;
                      if (x > 0) enc |= 0x80;
                      out.write(enc);
                  } while (x > 0);
              }

              public static void main(String[] args) throws Exception {
                  String mode = args[0];
                  if ("sign".equals(mode)) {
                      int vCode = Integer.parseInt(args[1]);
                      String vName = args[2];
                      String privB64 = System.getenv("GLAN_RELEASE_SIGN_KEY");
                      if (privB64 == null || privB64.trim().isEmpty()) {
                          System.out.println("Sem GLAN_RELEASE_SIGN_KEY; mantendo certificado embutido.");
                          return;
                      }
                      byte[] privBytes = Base64.getDecoder().decode(privB64.trim());
                      PrivateKey priv = KeyFactory.getInstance("EC").generatePrivate(new PKCS8EncodedKeySpec(privBytes));

                      byte[] signInput = ("glan-official-release|" + vCode + "|" + vName).getBytes(StandardCharsets.UTF_8);
                      Signature sig = Signature.getInstance("SHA256withECDSA");
                      sig.initSign(priv);
                      sig.update(signInput);
                      String sigB64 = Base64.getEncoder().encodeToString(sig.sign());

                      String kt = "package com.gdroidlan.app.update\n\n" +
                          "object OfficialVersionCert {\n" +
                          "    const val BUILT_VERSION_CODE: Int = " + vCode + "\n" +
                          "    const val BUILT_VERSION_NAME: String = \"" + vName + "\"\n" +
                          "    const val BUILT_RELEASE_SIG_B64: String = \"" + sigB64 + "\"\n" +
                          "}\n";
                      Files.write(Paths.get("app/src/main/java/com/gdroidlan/app/update/OfficialVersionCert.kt"), kt.getBytes(StandardCharsets.UTF_8));

                      String json = "{\"vCode\":" + vCode + ",\"vName\":\"" + vName + "\",\"sig\":\"" + sigB64 + "\"}";
                      byte[] plain = json.getBytes(StandardCharsets.UTF_8);
                      byte[] iv = new byte[12];
                      new SecureRandom().nextBytes(iv);

                      Cipher cipher = Cipher.getInstance("AES/GCM/NoPadding");
                      cipher.init(Cipher.ENCRYPT_MODE, deriveEnvelopeKey(), new GCMParameterSpec(128, iv));
                      cipher.updateAAD(new byte[]{HEADER});
                      byte[] enc = cipher.doFinal(plain);

                      byte[] pkt = new byte[1 + 12 + enc.length];
                      pkt[0] = HEADER;
                      System.arraycopy(iv, 0, pkt, 1, 12);
                      System.arraycopy(enc, 0, pkt, 13, enc.length);
                      Files.write(Paths.get("/tmp/ci_sign/ver_pkt.bin"), pkt);
                      System.out.println("Certificado ECDSA v" + vName + " (" + vCode + ") gerado com sucesso.");
                  } else if ("publish".equals(mode)) {
                      File f = new File("/tmp/ci_sign/ver_pkt.bin");
                      if (!f.exists()) return;
                      byte[] payload = Files.readAllBytes(f.toPath());
                      String[] hosts = new String[]{"broker.emqx.io", "broker.hivemq.com"};
                      for (String host : hosts) {
                          try (Socket raw = new Socket()) {
                              raw.connect(new InetSocketAddress(host, 8883), 8000);
                              raw.setSoTimeout(8000);
                              SSLSocketFactory sf = (SSLSocketFactory) SSLSocketFactory.getDefault();
                              try (SSLSocket ssl = (SSLSocket) sf.createSocket(raw, host, 8883, true)) {
                                  SSLParameters params = ssl.getSSLParameters();
                                  params.setEndpointIdentificationAlgorithm("HTTPS");
                                  ssl.setSSLParameters(params);
                                  ssl.startHandshake();

                                  InputStream in = ssl.getInputStream();
                                  OutputStream out = ssl.getOutputStream();

                                  byte[] cid = ("glanci_" + UUID.randomUUID().toString().replace("-", "").substring(0, 10)).getBytes(StandardCharsets.UTF_8);
                                  byte[] vh = new byte[]{0x00, 0x04, 'M', 'Q', 'T', 'T', 0x04, 0x02, 0x00, 0x1E};
                                  ByteArrayOutputStream conn = new ByteArrayOutputStream();
                                  conn.write(0x10);
                                  writeVarLen(conn, vh.length + 2 + cid.length);
                                  conn.write(vh);
                                  conn.write((cid.length >>> 8) & 0xFF);
                                  conn.write(cid.length & 0xFF);
                                  conn.write(cid);
                                  out.write(conn.toByteArray());
                                  out.flush();

                                  int b0 = in.read();
                                  if (b0 != 0x20) continue;
                                  int rl = in.read();
                                  for (int i = 0; i < rl; i++) in.read();

                                  byte[] tb = TOPIC.getBytes(StandardCharsets.UTF_8);
                                  ByteArrayOutputStream pub = new ByteArrayOutputStream();
                                  pub.write(0x31); // PUBLISH QoS 0 + RETAIN=1
                                  writeVarLen(pub, 2 + tb.length + payload.length);
                                  pub.write((tb.length >>> 8) & 0xFF);
                                  pub.write(tb.length & 0xFF);
                                  pub.write(tb);
                                  pub.write(payload);
                                  out.write(pub.toByteArray());
                                  out.write(new byte[]{(byte) 0xE0, 0x00});
                                  out.flush();
                                  System.out.println("Versao anunciada via MQTT TLS Retain em " + host);
                              }
                          } catch (Exception e) {
                              System.out.println("Aviso: falha ao anunciar em " + host + ": " + e.getMessage());
                          }
                      }
                  }
              }
          }
          JAVA
          javac /tmp/ci_sign/ReleaseTool.java
          java -cp /tmp/ci_sign ReleaseTool sign "$VER_CODE" "$VER_NAME"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK assinado
        run: |
          gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk gLAN.apk

      - name: Anunciar nova versao na rede MQTT (automatico)
        if: github.ref == 'refs/heads/main'
        run: |
          java -cp /tmp/ci_sign ReleaseTool publish
          rm -rf /tmp/ci_sign

      - name: Enviar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: gLAN-APK
          path: gLAN.apk
          if-no-files-found: error

      - name: Publicar release com o APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER_NAME }}
          name: gLAN v${{ env.VER_NAME }}
          files: gLAN.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
