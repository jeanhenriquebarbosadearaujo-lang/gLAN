plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.gdroidlan.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.gdroidlan.app"
        minSdk 24
        targetSdk 34
        versionCode 7
        versionName "2.5"
    }

    signingConfigs {
        stableKey {
            storeFile file('gdroidlan.keystore')
            storePassword 'gdroidlan123'
            keyAlias 'gdroidlankey'
            keyPassword 'gdroidlan123'
            enableV1Signing = true
            enableV2Signing = true
            enableV3Signing = true
        }
    }

    buildTypes {
        debug {
            debuggable false
            jniDebuggable false
            signingConfig signingConfigs.stableKey
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.stableKey
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
